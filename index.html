<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPGS Draw">
<title>SPGS Number Draw</title>
<style>
:root {
  --bg:#05070b;
  --panel:#0d1118;
  --panel2:#111723;
  --red:#e31b23;
  --blue:#1378ff;
  --gold:#f6b82d;
  --white:#f5f7fb;
  --muted:#9099a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05070b;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  display:flex;justify-content:center;align-items:center;
  padding:max(16px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(19,120,255,.18),transparent 28%),
    radial-gradient(circle at 80% 22%,rgba(227,27,35,.14),transparent 24%),
    linear-gradient(180deg,#090d14 0%,#05070b 55%,#030405 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:22px 22px;
}
.app{width:100%;max-width:430px;position:relative}
.logo-wrap{text-align:center;margin:0 auto 8px}
.logo{
  width:min(235px,62vw);display:block;margin:auto;border-radius:50%;
  filter:drop-shadow(0 14px 24px rgba(0,0,0,.55));
}
.title{text-align:center;margin-top:-4px}
.title h1{margin:0;font-size:30px;letter-spacing:.8px;font-weight:950;text-transform:uppercase}
.title p{margin:4px 0 14px;color:var(--red);font-weight:900;letter-spacing:4px;font-size:12px;text-transform:uppercase}
.card{
  border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:18px;
  background:linear-gradient(180deg,rgba(18,24,34,.96),rgba(8,11,16,.97));
  box-shadow:0 22px 60px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.04);
}
.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.group label{display:block;text-align:center;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase}
input{
  width:100%;height:58px;border-radius:14px;border:1px solid rgba(255,255,255,.17);
  background:#05070a;color:#fff;text-align:center;font-size:27px;font-weight:950;outline:none;
  appearance:textfield;
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(19,120,255,.14)}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{appearance:none;margin:0}
.sep{padding-bottom:16px;color:#737c8a;font-size:26px;font-weight:900}
.draw-btn,.again-btn{
  width:100%;border:0;border-radius:15px;min-height:62px;margin-top:16px;
  font-size:19px;font-weight:950;letter-spacing:.7px;text-transform:uppercase;color:white;
  cursor:pointer;box-shadow:0 13px 30px rgba(0,0,0,.28);transition:.16s transform,.16s opacity;
}
.draw-btn{background:linear-gradient(180deg,#f02a31,#b90810);border:1px solid rgba(255,255,255,.16)}
.again-btn{background:linear-gradient(180deg,#1681ff,#074fba);display:none}
.draw-btn:active,.again-btn:active{transform:scale(.985)}
.draw-btn:disabled{opacity:.55}
.result{
  margin-top:16px;min-height:248px;border-radius:22px;border:1px solid rgba(19,120,255,.52);
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at center,rgba(246,184,45,.12),transparent 48%),
    linear-gradient(180deg,#0a0d12,#05070a);
}
.result:before{
  content:"";position:absolute;inset:0;opacity:.25;
  background-image:radial-gradient(circle,rgba(255,255,255,.25) 1px,transparent 1.3px);
  background-size:16px 16px;
}
.result-label{position:relative;color:#1d8cff;font-weight:950;letter-spacing:2px;text-transform:uppercase;font-size:14px}
.number{
  position:relative;font-size:112px;line-height:1;margin:8px 0 4px;font-weight:1000;letter-spacing:-5px;
  color:var(--gold);text-shadow:0 0 28px rgba(246,184,45,.35),0 6px 0 rgba(0,0,0,.35);
}
.range-copy{position:relative;color:#a8b0bd;font-size:13px;font-weight:800;letter-spacing:1px}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;color:#8f98a7;font-size:11px;font-weight:750}
.pill{flex:1;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);text-align:center}
.error{color:#ff6b70!important}
.flash{animation:flash .5s ease}
.winner{animation:winner .7s cubic-bezier(.2,.9,.25,1.2)}
.shake{animation:shake .22s linear}
.confetti{position:absolute;width:8px;height:14px;top:-20px;border-radius:2px;animation:fall 1.5s linear forwards}
@keyframes winner{0%{transform:scale(.35);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes flash{0%{box-shadow:0 0 0 rgba(246,184,45,0)}50%{box-shadow:0 0 60px rgba(246,184,45,.45)}100%{box-shadow:0 0 0 rgba(246,184,45,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes fall{to{transform:translateY(330px) rotate(520deg);opacity:.1}}
.footer{text-align:center;margin-top:13px;color:#6f7784;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.small-note{text-align:center;margin:10px 0 0;color:#77808d;font-size:11px}
@media(max-height:760px){
  .logo{width:150px} .title h1{font-size:24px} .result{min-height:190px} .number{font-size:88px}
}
</style>
</head>

  <div class="title">
    <h1>Number Generator</h1>
    <p>Fuel the Game</p>
  </div>

  <section class="card">
    <div class="range-row">
      <div class="group">
        <label for="min">Minimum</label>
        <input id="min" type="number" inputmode="numeric" value="1">
      </div>
      <div class="sep">–</div>
      <div class="group">
        <label for="max">Maximum</label>
        <input id="max" type="number" inputmode="numeric" value="9">
      </div>
    </div>

    <button class="draw-btn" id="drawBtn">🎲 Draw Number</button>

    <div class="result" id="resultPanel">
      <div class="result-label" id="resultLabel">Ready to Draw</div>
      <div class="number" id="number">—</div>
      <div class="range-copy" id="rangeCopy">Range: 1–9</div>
      <button class="again-btn" id="againBtn">↻ Draw Again</button>
    </div>

    <div class="meta">
      <div class="pill" id="timePill">No draw yet</div>
      <div class="pill">Secure random draw</div>
    </div>

    <p class="small-note" id="status">Each number has an equal chance.</p>
  </section>

  <div class="footer">Slowpitch Gas Station • Est. 2025</div>
</main>

<script>
const minEl = document.getElementById('min');
const maxEl = document.getElementById('max');
const drawBtn = document.getElementById('drawBtn');
const againBtn = document.getElementById('againBtn');
const numberEl = document.getElementById('number');
const labelEl = document.getElementById('resultLabel');
const rangeCopy = document.getElementById('rangeCopy');
const statusEl = document.getElementById('status');
const timePill = document.getElementById('timePill');
const resultPanel = document.getElementById('resultPanel');
let drawing = false;

function secureRandomInteger(min, max) {
  const range = max - min + 1;
  const maxUint = 0x100000000;
  const limit = Math.floor(maxUint / range) * range;
  const buf = new Uint32Array(1);
  let value;
  do {
    crypto.getRandomValues(buf);
    value = buf[0];
  } while (value >= limit);
  return min + (value % range);
}

function getRange() {
  const min = Number(minEl.value);
  const max = Number(maxEl.value);
  if (!Number.isSafeInteger(min) || !Number.isSafeInteger(max)) throw new Error('Use whole numbers only.');
  if (min < 0 || max < 0) throw new Error('Numbers cannot be negative.');
  if (max < min) throw new Error('Maximum must be at least the minimum.');
  if ((max - min) > 1000000) throw new Error('Please use a smaller range.');
  return {min,max};
}

function addConfetti() {
  const colors = ['#e31b23','#1378ff','#f6b82d','#ffffff'];
  for (let i=0;i<34;i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*.25) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    resultPanel.appendChild(c);
    setTimeout(()=>c.remove(),1800);
  }
}

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

function runDraw() {
  if (drawing) return;
  let range;
  try {
    range = getRange();
  } catch (e) {
    statusEl.textContent = e.message;
    statusEl.classList.add('error');
    resultPanel.classList.add('shake');
    setTimeout(()=>resultPanel.classList.remove('shake'),250);
    return;
  }

  statusEl.classList.remove('error');
  drawing = true;
  drawBtn.disabled = true;
  minEl.disabled = true;
  maxEl.disabled = true;
  againBtn.style.display = 'none';
  labelEl.textContent = 'Drawing';
  statusEl.textContent = 'Randomizing…';
  rangeCopy.textContent = `Range: ${range.min}–${range.max}`;
  numberEl.classList.remove('winner');
  resultPanel.classList.remove('flash');

  const start = performance.now();
  const duration = 2400;
  let interval = 55;

  const timer = setInterval(() => {
    numberEl.textContent = secureRandomInteger(range.min, range.max);
    if (performance.now() - start >= duration) {
      clearInterval(timer);
      const winner = secureRandomInteger(range.min, range.max);
      numberEl.textContent = winner;
      labelEl.textContent = '★ Winning Number ★';
      statusEl.textContent = 'Each number had an equal chance.';
      timePill.textContent = 'Drawn at ' + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
      void numberEl.offsetWidth;
      numberEl.classList.add('winner');
      resultPanel.classList.add('flash');
      addConfetti();
      vibrate([80,50,180]);
      againBtn.style.display = 'block';
      drawBtn.disabled = false;
      minEl.disabled = false;
      maxEl.disabled = false;
      drawing = false;
    }
  }, interval);
}

drawBtn.addEventListener('click', runDraw);
againBtn.addEventListener('click', runDraw);
maxEl.addEventListener('keydown', e => { if (e.key === 'Enter') runDraw(); });
[minEl,maxEl].forEach(el => el.addEventListener('input', () => {
  rangeCopy.textContent = `Range: ${minEl.value || '—'}–${maxEl.value || '—'}`;
}));
</script>
</body>
</html>
